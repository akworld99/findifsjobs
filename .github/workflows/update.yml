# Refreshes the jobs every morning, rebuilds the page and publishes it on GitHub Pages.
# Free URL, no domain needed: https://<your-username>.github.io/<repo-name>/
name: Update and publish

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 Colombo, every day
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]
    paths-ignore: ["jobs.json", "last_run.txt", "logos/**"]   # the bot's own data commit must not trigger another run

permissions:
  contents: write   # commit the refreshed jobs.json
  pages: write      # publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new IFS jobs
        # A broken feed should not stop the site from publishing.
        run: python aggregator.py || echo "Some sources failed, publishing with what we have"
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}     # optional
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}   # optional

      - name: Fetch company logos
        run: pip install -q pillow && python fetch_logos.py || echo "Logo fetch had problems, building with what we have"

      - name: Build the page
        run: |
          python build.py
          mkdir -p site
          cp index.html site/
          [ -d logos ] && cp -r logos site/ || true

      - name: Save the refreshed job list
        run: |
          git config user.name "findifsjobs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json last_run.txt logos
          git diff --cached --quiet || git commit -m "Daily job refresh"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
